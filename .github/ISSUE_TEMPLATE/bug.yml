name: Bug report
description: Report a reproducible CTKF Community defect without private data.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private requirements, customer data, payment evidence, or Pro assets.
  - type: input
    id: version
    attributes:
      label: CTKF Community version
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["Windows", "macOS", "Linux"]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use a synthetic requirement document and sanitize all paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
