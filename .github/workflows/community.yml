name: community-quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Community package
        run: python -m pip install -e .

      - name: Run unit and negative-path tests
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end requirement smoke test
        run: |
          ctkf-community init --requirements examples/booking-product-brief.zh-CN.txt --project generated/booking-demo --ide codex
          ctkf-community verify --project generated/booking-demo

      - name: Build installable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Upload wheel
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: ctkf-community-wheel
          if-no-files-found: error
          path: dist/*.whl
