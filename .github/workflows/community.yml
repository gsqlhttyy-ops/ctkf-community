name: community-quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build installable wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install the built wheel
        run: python -m pip install --no-deps --force-reinstall dist/*.whl

      - name: Check installed runtime
        run: |
          ctkf-community --version
          ctkf-community doctor

      - name: Run unit and negative-path tests
        run: python -m unittest discover -s tests -v

      - name: Run end-to-end requirement smoke test
        run: |
          ctkf-community init --requirements examples/booking-product-brief.zh-CN.txt --project generated/booking-demo --ide codex
          ctkf-community verify --project generated/booking-demo

      - name: Upload wheel
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ctkf-community-wheel
          if-no-files-found: error
          path: dist/*.whl
