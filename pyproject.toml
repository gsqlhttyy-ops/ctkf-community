[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "ctkf-community"
version = "0.2.0"
description = "Open requirement-to-execution planning for governed personal AI development"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "CTKF maintainers"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/gsqlhttyy-ops/ctkf-community"
Issues = "https://github.com/gsqlhttyy-ops/ctkf-community/issues"
"CTKF Pro" = "https://pay.truststream.top/"

[project.scripts]
ctkf-community = "ctkf_community.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
